[package]
name = "async-inspect"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
authors = ["Ibrahim Cesar <email@ibrahimcesar.com>"]
license = "MIT"
description = "X-ray vision for async Rust - inspect and debug async state machines"
homepage = "https://github.com/ibrahimcesar/async-inspect"
repository = "https://github.com/ibrahimcesar/async-inspect"
documentation = "https://docs.rs/async-inspect"
keywords = ["async", "debugging", "inspection", "state-machine", "tokio"]
categories = ["asynchronous", "development-tools::debugging"]
readme = "README.md"
# Exclude development files from crates.io package
exclude = [
    ".github/",
    ".vscode/",
    ".claude/",
    "intellij-plugin/",
    "vscode-extension/",
    "scripts/",
    "lsp-config/",
    "docs/",
    "async_inspect_exports/",
    "*.log",
    "*.profraw",
    "*.profdata",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
# Allow unstable feature check for async-std runtime integration
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(feature, values(\"unstable\"))"] }

[lib]
name = "async_inspect"
path = "src/lib.rs"

[[bin]]
name = "async-inspect"
path = "src/main.rs"

[[bin]]
name = "async-inspect-lsp"
path = "src/bin/async-inspect-lsp.rs"
required-features = ["lsp"]

[dependencies]
# Core async
futures = "0.3"
pin-project = "1.1"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# CLI
clap = { version = "4.5", features = ["derive", "cargo"] }
colored = "2.1"

# TUI (optional)
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.28", optional = true }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"

# Tokio integration (optional)
tokio = { version = "1.35", features = [
    "rt",
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "io-std",
], optional = true }

# async-std integration (optional)
async-std = { version = "1.12", optional = true }

# smol integration (optional)
smol = { version = "2.0", optional = true }

# Tracing integration
tracing = "0.1"
tracing-subscriber = { version = "0.3", optional = true }

# Ecosystem integrations (optional)
prometheus = { version = "0.13", optional = true, default-features = false }
opentelemetry = { version = "0.21", optional = true }
opentelemetry_sdk = { version = "0.21", optional = true }

# Flamegraph generation (optional)
inferno = { version = "0.11", optional = true }

# Dashboard (optional)
axum = { version = "0.7", optional = true, features = ["ws"] }
tokio-tungstenite = { version = "0.21", optional = true }
tower-http = { version = "0.5", optional = true, features = ["fs", "cors"] }

# LSP (Language Server Protocol) support (optional)
tower-lsp = { version = "0.20", optional = true }
tokio-util = { version = "0.7", optional = true, features = ["codec"] }

# Time tracking
parking_lot = "0.12"
once_cell = "1.19"

# Proc macros (internal)
async-inspect-macros = { version = "0.1.0", path = "async-inspect-macros" }

[dev-dependencies]
tokio = { version = "1.35", features = ["full"] }
tokio-test = "0.4"
criterion = { version = "0.5", features = ["async_tokio"] }
colored = "2.1"

[features]
default = ["cli", "tokio"]

# CLI with TUI
cli = ["ratatui", "crossterm"]

# Runtime support
tokio = ["dep:tokio"]
async-std-runtime = ["async-std"]
smol-runtime = ["smol"]

# Tracing ecosystem integration
tracing-sub = ["tracing-subscriber"]

# Ecosystem integrations
prometheus-export = ["prometheus"]
opentelemetry-export = ["opentelemetry", "opentelemetry_sdk"]

# Flamegraph SVG generation
flamegraph = ["inferno"]

# Web dashboard
dashboard = ["axum", "tokio-tungstenite", "tower-http", "tokio"]

# LSP server
lsp = ["tower-lsp", "tokio-util", "tokio"]

# All features
full = ["cli", "tokio", "tracing-sub", "prometheus-export", "opentelemetry-export", "flamegraph", "dashboard", "lsp"]

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[[example]]
name = "basic_inspection"
path = "examples/basic_inspection.rs"

[[example]]
name = "simple_test"
path = "examples/simple_test.rs"

[[example]]
name = "tokio_integration"
path = "examples/tokio_integration.rs"
required-features = ["tokio"]

[[example]]
name = "deadlock_detection"
path = "examples/deadlock_detection.rs"

[[example]]
name = "performance_analysis"
path = "examples/performance_analysis.rs"
required-features = ["tokio"]

[[example]]
name = "visualization"
path = "examples/visualization.rs"
required-features = ["tokio"]

[[example]]
name = "task_hierarchy"
path = "examples/task_hierarchy.rs"
required-features = ["tokio"]

[[example]]
name = "proc_macro_test"
path = "examples/proc_macro_test.rs"

[[example]]
name = "tui_monitor"
path = "examples/tui_monitor.rs"
required-features = ["cli"]

[[example]]
name = "production_ready"
path = "examples/production_ready.rs"
required-features = ["tokio"]

[[example]]
name = "relationship_graph"
path = "examples/relationship_graph.rs"

[[example]]
name = "ecosystem_integration"
path = "examples/ecosystem_integration.rs"
required-features = ["tokio"]

[[example]]
name = "export_formats"
path = "examples/export_formats.rs"
required-features = ["tokio"]

[[example]]
name = "async_std_integration"
path = "examples/async_std_integration.rs"
required-features = ["async-std-runtime"]

[[example]]
name = "smol_integration"
path = "examples/smol_integration.rs"
required-features = ["smol-runtime"]

[[example]]
name = "performance_profiling"
path = "examples/performance_profiling.rs"
required-features = ["tokio"]

[[example]]
name = "dashboard_demo"
path = "examples/dashboard_demo.rs"
required-features = ["dashboard"]

[[example]]
name = "auto_lock_tracking"
path = "examples/auto_lock_tracking.rs"
required-features = ["tokio"]

[[example]]
name = "channel_visualization"
path = "examples/channel_visualization.rs"
required-features = ["tokio"]

[[bench]]
name = "overhead"
harness = false

[[bench]]
name = "throughput"
harness = false
