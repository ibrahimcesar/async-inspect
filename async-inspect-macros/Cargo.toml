[package]
name = "async-inspect-macros"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
authors = ["Ibrahim Cesar <email@ibrahimcesar.com>"]
license = "MIT"
description = "Procedural macros for async-inspect - X-ray vision for async Rust"
homepage = "https://github.com/ibrahimcesar/async-inspect"
repository = "https://github.com/ibrahimcesar/async-inspect"
documentation = "https://docs.rs/async-inspect"
keywords = ["async", "debugging", "macros", "proc-macro", "tokio"]
categories = ["asynchronous", "development-tools::debugging"]

[lib]
proc-macro = true

[dependencies]
syn = { version = "2.0", features = ["full", "extra-traits", "visit-mut"] }
quote = "1.0"
proc-macro2 = "1.0"
