# cargo-deny configuration for supply chain security
# Documentation: https://embarkstudios.github.io/cargo-deny/

[advisories]
# Security vulnerability database
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
    # async-std is unmaintained but we provide optional support for it
    "RUSTSEC-2025-0052",
    # paste is unmaintained - transitive dependency
    "RUSTSEC-2024-0436",
]

[licenses]
# License policy
version = 2
confidence-threshold = 0.8

# Allow common permissive licenses
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "Unicode-3.0",
]

# Private crate exceptions
private = { ignore = true }

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 }
]

[bans]
# Banned crates
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

# Skip checking for duplicate versions (warnings only)
skip = []
skip-tree = []

[sources]
# Source control
unknown-registry = "deny"
unknown-git = "deny"

# Only allow crates.io
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
