<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Monitor frame -->
  <rect x="25" y="25" width="150" height="110" rx="8" stroke="#6366f1" stroke-width="4" fill="#eef2ff"/>
  <!-- Screen content -->
  <rect x="35" y="35" width="130" height="90" rx="4" fill="#1e1b4b"/>
  <!-- Terminal lines -->
  <rect x="45" y="45" width="60" height="8" rx="2" fill="#22c55e"/>
  <rect x="45" y="60" width="80" height="8" rx="2" fill="#3b82f6"/>
  <rect x="45" y="75" width="50" height="8" rx="2" fill="#eab308"/>
  <rect x="45" y="90" width="70" height="8" rx="2" fill="#8b5cf6"/>
  <rect x="45" y="105" width="40" height="8" rx="2" fill="#ef4444"/>
  <!-- Mini chart on right side -->
  <rect x="125" y="45" width="30" height="68" rx="2" fill="#312e81"/>
  <rect x="130" y="75" width="6" height="33" fill="#22c55e"/>
  <rect x="140" y="60" width="6" height="48" fill="#3b82f6"/>
  <rect x="130" y="50" width="6" height="20" fill="#f97316"/>
  <rect x="140" y="50" width="6" height="5" fill="#ef4444"/>
  <!-- Stand -->
  <rect x="85" y="135" width="30" height="8" fill="#6366f1"/>
  <rect x="70" y="143" width="60" height="12" rx="4" fill="#6366f1"/>
  <!-- Live indicator -->
  <circle cx="160" cy="40" r="5" fill="#22c55e"/>
</svg>
