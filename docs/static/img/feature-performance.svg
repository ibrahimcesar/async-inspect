<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Chart background -->
  <rect x="30" y="30" width="140" height="140" rx="8" stroke="#8b5cf6" stroke-width="3" fill="#f5f3ff"/>
  <!-- Grid lines -->
  <line x1="30" y1="100" x2="170" y2="100" stroke="#c4b5fd" stroke-width="1"/>
  <line x1="30" y1="65" x2="170" y2="65" stroke="#c4b5fd" stroke-width="1"/>
  <line x1="30" y1="135" x2="170" y2="135" stroke="#c4b5fd" stroke-width="1"/>
  <!-- Performance bars -->
  <rect x="45" y="90" width="20" height="70" rx="4" fill="#22c55e"/>
  <rect x="75" y="60" width="20" height="100" rx="4" fill="#3b82f6"/>
  <rect x="105" y="80" width="20" height="80" rx="4" fill="#8b5cf6"/>
  <rect x="135" y="45" width="20" height="115" rx="4" fill="#f97316"/>
  <!-- Trend line -->
  <path d="M55 90 L85 60 L115 80 L145 45" stroke="#ef4444" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="55" cy="90" r="4" fill="#ef4444"/>
  <circle cx="85" cy="60" r="4" fill="#ef4444"/>
  <circle cx="115" cy="80" r="4" fill="#ef4444"/>
  <circle cx="145" cy="45" r="4" fill="#ef4444"/>
</svg>
