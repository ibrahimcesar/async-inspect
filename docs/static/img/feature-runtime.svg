<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Central hub -->
  <circle cx="100" cy="100" r="30" stroke="#10b981" stroke-width="3" fill="#ecfdf5"/>
  <text x="100" cy="105" text-anchor="middle" fill="#10b981" font-size="14" font-weight="bold">async</text>
  <!-- Runtime nodes -->
  <circle cx="100" cy="35" r="20" stroke="#3b82f6" stroke-width="2" fill="#dbeafe"/>
  <text x="100" y="40" text-anchor="middle" fill="#3b82f6" font-size="10" font-weight="bold">tokio</text>
  <circle cx="165" cy="100" r="20" stroke="#8b5cf6" stroke-width="2" fill="#f5f3ff"/>
  <text x="165" y="105" text-anchor="middle" fill="#8b5cf6" font-size="10" font-weight="bold">smol</text>
  <circle cx="100" cy="165" r="20" stroke="#f97316" stroke-width="2" fill="#fff7ed"/>
