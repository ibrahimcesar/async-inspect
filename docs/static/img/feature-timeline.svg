<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Timeline base -->
  <line x1="20" y1="100" x2="180" y2="100" stroke="#94a3b8" stroke-width="3"/>
  <!-- Time markers -->
  <line x1="40" y1="95" x2="40" y2="105" stroke="#94a3b8" stroke-width="2"/>
  <line x1="80" y1="95" x2="80" y2="105" stroke="#94a3b8" stroke-width="2"/>
  <line x1="120" y1="95" x2="120" y2="105" stroke="#94a3b8" stroke-width="2"/>
  <line x1="160" y1="95" x2="160" y2="105" stroke="#94a3b8" stroke-width="2"/>
  <!-- Task spans - upper track -->
  <rect x="30" y="55" width="50" height="20" rx="4" fill="#3b82f6"/>
  <rect x="90" y="55" width="80" height="20" rx="4" fill="#22c55e"/>
  <!-- Task spans - lower track -->
  <rect x="50" y="125" width="40" height="20" rx="4" fill="#8b5cf6"/>
  <rect x="100" y="125" width="60" height="20" rx="4" fill="#f97316"/>
  <!-- Await points -->
  <circle cx="80" cy="65" r="6" fill="#eab308" stroke="#000" stroke-width="1"/>
  <circle cx="90" cy="135" r="6" fill="#eab308" stroke="#000" stroke-width="1"/>
  <circle cx="140" cy="65" r="6" fill="#eab308" stroke="#000" stroke-width="1"/>
  <!-- Connection arrows -->
  <path d="M80 75 L80 90 L90 90 L90 120" stroke="#ef4444" stroke-width="2" fill="none" stroke-dasharray="4 2"/>
  <!-- Labels -->
  <text x="55" y="50" text-anchor="middle" fill="#3b82f6" font-size="10">Task A</text>
  <text x="130" y="50" text-anchor="middle" fill="#22c55e" font-size="10">Task B</text>
  <text x="70" y="160" text-anchor="middle" fill="#8b5cf6" font-size="10">Task C</text>
  <text x="130" y="160" text-anchor="middle" fill="#f97316" font-size="10">Task D</text>
</svg>
